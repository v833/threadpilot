# ThreadPilot 插件装配文件（一切皆为插件）
# 这里声明启用哪些插件及其参数；移除条目或设置 disabled: true 即可下线对应能力。
# 参考 deepseek-harness 的 cordis.yml 设计：能力由配置组装，而不是硬编码。
plugins:
  - name: config
    config:
      botsPath: config/bots.json
  # 提示词管理：集中模板定义、分层覆盖（prompts/ 与 .agents/prompts/）与流水线组装
  - name: prompts
  - name: team
  - name: sessions
  - name: cli
  # Agent 管理页面:查看/配置每 agent 的 codex/claude 引擎模型(baseUrl/apiKey/model/wireApi)
  # 与工作目录覆盖,保存即热更新(重启受影响 agent 的常驻引擎;headless 下次任务自动生效)。
  # 配置存 config/engines.json(明文密钥:已 gitignore,服务器上需 chmod 600);
  # 环境变量 ADMIN_API_PORT(缺省 3103)/ADMIN_API_TOKEN(必配,管理接口访问令牌)。
  - name: agent-admin
  - name: application-tools
  - name: engines/claude
  - name: engines/codex
  - name: engines/dimagent
  - name: engines/agy
  # 标准 ACP 接入：engines 列表可声明任意提供 ACP server 的 CLI。
  # 移除本插件或 engines 列表即可整体下线 ACP 接入能力。
  - name: engines/acp
    config:
      engines:
        - id: dimagent
          command: dim
          args: [acp]
          displayName: DimAgent
          resumeMethod: load
          minAgentVersion: "0.3.10"
          acpMcpTransports: [http, sse]
          session:
            configOptions:
              permission: full-access
              mode: agent
        # Claude Code ACP：官方 Claude Agent SDK 适配器（@agentclientprotocol/claude-agent-acp），
        # 本地 node 入口避免 Windows 下 spawn npx(.cmd) 的问题；认证复用 Claude 登录态或 ANTHROPIC_API_KEY。
        - id: claude
          command: node
          args: ["node_modules/@agentclientprotocol/claude-agent-acp/dist/index.js"]
          displayName: Claude (ACP)
          resumeMethod: load
          acpMcpTransports: [http, sse]
  - name: lark
  - name: cards
  - name: commands
  - name: commands/help
  - name: commands/board
    config:
      bootstrapRequestIntervalMs: 100 # 一键建表 OpenAPI 请求间隔；测试覆盖为 0
  - name: commands/metrics
  # /login：为当前会话引擎（或 "/<engine> login"）发起登录卡片；依赖 auth 插件。
  - name: commands/login
  - name: commands/new
  - name: commands/resume
  - name: commands/compact
  # /doc：显式开启文档交付能力，普通任务不会自动生成云文档。
  - name: commands/doc
  - name: commands/status
  - name: commands/team
  - name: commands/cd
  - name: commands/close
  - name: commands/schedule
  - name: commands/schedules
  # 多话题并行编排：/orchestrate 拆解派发 + /panel 进度总览。
  # 移除此条目即整体下线编排能力；命令与执行拆开为独立插件可分别调整。
  - name: commands/orchestrate
  - name: commands/panel
  - name: collaboration
  # 通用团队派发：注册 dispatch_task，并由 Team Leader 通过协作服务真实 @ 成员。
  - name: dispatch-task
  - name: orchestration
    config:
      # 派发方式：topic=每个子任务在编排群内独立新话题派发（默认，同 bot 可跨话题并行承接多个子任务）；
      # same-topic=在当前话题回复派发（兼容降级，同 bot 多子任务整轮拒绝）。
      dispatchMode: topic
      # 失败子任务一键重试的最大次数，默认 2；达到上限后面板不再渲染重试按钮。
      maxRetry: 2
      # pending 子任务等待结果的最长时间（毫秒），默认 30 分钟；超时后收口为 failed。
      pendingTimeoutMs: 1800000
  # 编排实时面板：/orchestrate 派发后自动挂起实时汇总面板卡片，子任务状态变化节流刷新、终态定格。
  # 移除本条目即回退为“仅汇总文本”（orchestration/update 无消费者，事件空转无害）。
  - name: orchestration/live-panel
  # 编排面板动作：认领「重试」按钮，一键重新派发失败子任务（带鉴权/去重/次数上限）。
  # 移除本条目即下线一键重试——面板不渲染重试按钮，保留手动「继续执行」。
  - name: orchestration/actions
  # 可观测性与链路追踪：收集 Span、Token 消耗、时延分位数与指标大盘；移除即可整体下线。
  - name: observability
    config:
      maxTracesInMemory: 500
      exportToFile: false
      traceLogPath: "data/traces.jsonl"
  # 飞书多维表格任务看板：把任务生命周期实时同步到 Bitable，并轮询表格反向拉起新任务。
  # 两种挂载方式二选一：
  #   1) 一键初始化：群聊中发送 /board init 自动建表并热挂载，配置持久化到 data/bitable-board.json，重启自愈；
  #   2) 静态配置：已有表格时在下方填入 appToken/tableId 即可挂载（无需 /board init）。
  # 移除本条目或设置 disabled: true 即可下线看板服务。
  - name: bitable-board
    config:
      # appToken: ""          # 静态配置模式：多维表格 app_token
      # tableId: ""           # 静态配置模式：数据表 ID
      # fallbackChatId: ""    # 反向拉起回退群聊（记录未填“群聊ID”时开工的群）：
      #                       #   - /board init 模式：自动绑定初始化群并持久化，无需配置
      #                       #   - 静态配置模式：需手动指定，否则缺群聊ID的记录会被跳过
      # sync: true            # 单向事件同步（ThreadPilot ➔ Bitable）
      # pull: true            # 反向任务拉起（Bitable ➔ ThreadPilot）
      # pollIntervalMs: 30000 # 反向拉起轮询间隔（毫秒）
  - name: tasks
  # 普通任务失败后一键重试：保存有界内存快照、严格鉴权、轮次隔离和一次性消费。
  # 移除此插件即不再渲染或响应重试按钮，普通失败卡与手动发消息重试不受影响。
  - name: task-retry
    config:
      ttlMs: 3600000
      maxContexts: 500
  # 结构化澄清：移除此插件即可停止 MCP 注入、问题卡片和回答恢复链路。
  - name: clarification
  # CLI 登录：任务因认证失败时发飞书卡片收集登录 key，并驱动引擎完成登录。
  # 移除本插件即回退为普通失败卡片（引擎适配器声明的 login 能力保留但无人消费）。
  - name: auth
  # 产品文档：校验 Spec/Tickets 真实落盘并提供发起人确认卡；移除即可整体下线。
  - name: product-spec
  # 云文档评论评审：@产品经理后恢复原产品会话并把修改说明回复到评论。
  - name: product-comments
  # 定时任务：三种调度规则（once/interval/cron）+ 运行记录分离 + schedule_manage 工具 +
  # loopback 管理 API（环境变量 SCHEDULE_API_PORT/TOKEN）+ schedules.json 热更新。
  # 整体下线时同时移除 schedule、commands/schedule、commands/schedules 三个条目。
  - name: schedule
    config:
      # storePath: data/schedules.json      # 计划文件（缺省）
      # runStorePath: data/schedule-runs.json # 运行记录文件（缺省）
  # 外部事件 Ingress：Webhook 网关（HMAC 验签/防重放/payload 规范化）、路由规则、
  # 外部实体→飞书话题 1:1 映射。缺省关闭（无规则与密钥时不对外提供服务）。
  # 启用示例：填入路由规则与来源密钥后，外部事件会按规则建话题并 @ 目标 bot。
  - name: ingress
    config:
      # storePath: data/entity-topics.json   # 实体→话题映射文件（缺省）
      # host: 0.0.0.0                       # 监听地址（缺省 0.0.0.0；反向代理同机可 127.0.0.1）
      # port: 3102                           # Webhook 网关端口（缺省 INGRESS_API_PORT）
      # senderBotId: developer               # 事件消息发送 bot（缺省第一个 bot）
      # rules:
      #   - id: github-pulls
      #     match: { source: github, eventType: "pull_request.*", entity: "v833/*" }
      #     chatId: oc_xxx
      #     mentionBots: [developer]
      #     priority: 10
      # auth:
      #   github: { secret: "换成本机 github webhook secret" }
      #   sentry: { secret: "换成本机 sentry secret" }
      #   generic: { expectedToken: "换成本机 bearer token" }
  # 全双工 Egress 回传：监听任务生命周期与 QA 结论，向 GitHub PR 评论或外部
  # Webhook 回传进展。缺省关闭（未配置 token/url 时静默跳过）。
  - name: egress
    config:
      # github: { token: "ghp_xxx" }        # 有 token 才回传 GitHub 评论
      # webhook: { url: "https://..." }     # 有 url 才回传通用 Webhook
  - name: router
