<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ThreadPilot</title>
  <desc id="desc">A TP monogram drawn as a conversation route returning to a leader control point.</desc>
  <rect x="48" y="48" width="928" height="928" rx="224" fill="#0B1220"/>
  <rect x="49" y="49" width="926" height="926" rx="223" fill="none" stroke="#263448" stroke-width="2"/>

  <!-- T 是任务入口，P 的闭合航线表示成员执行后回到 Leader。 -->
  <path d="M214 292H538" fill="none" stroke="#F4F7F5" stroke-width="76" stroke-linecap="round"/>
  <path d="M366 220V780" fill="none" stroke="#F4F7F5" stroke-width="76" stroke-linecap="round"/>
  <path d="M366 292H558C694 292 800 370 800 466C800 562 694 640 558 640H474"
        fill="none" stroke="#55D6D0" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 珊瑚色控制点代表唯一编排者，也是整条航线的起点。 -->
  <circle cx="366" cy="292" r="52" fill="#FF6B5F"/>
  <circle cx="366" cy="292" r="17" fill="#0B1220"/>
</svg>
